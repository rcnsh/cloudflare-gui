name: Release

# Push a tag like v0.2.0 to build a universal macOS app and publish it as a
# GitHub release. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test

      - name: Build for Apple Silicon and Intel
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Make a universal app
        run: |
          mkdir -p dist
          lipo -create -output dist/cloudflare-gui \
            target/aarch64-apple-darwin/release/cloudflare-gui \
            target/x86_64-apple-darwin/release/cloudflare-gui
          lipo -info dist/cloudflare-gui
          ./script/bundle dist/cloudflare-gui "$VERSION" dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/Cloudflare-GUI-$VERSION-macos-universal.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          else
            gh release create "$TAG" "$zip" "$zip.sha256" \
              --title "Cloudflare GUI $VERSION" --generate-notes
          fi
